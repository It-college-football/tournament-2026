<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT College Football Tournament</title>
<style>
body{margin:0;background:#f3f4f6;font-family:Arial,sans-serif;color:#111827}
header{background:#101827;color:#fff;padding:18px;text-align:center}
h1{margin:0;font-size:23px}.sub{margin-top:5px;color:#aab3c2}.sync{font-size:12px;margin-top:6px}
nav{display:flex;overflow:auto;background:#fff;padding:8px;gap:7px;position:sticky;top:0;z-index:5}
nav button{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;white-space:nowrap}
nav button.active{background:#101827;color:#fff}
main{max-width:1000px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.match{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:13px 0}.team{width:36%;font-weight:bold}.right{text-align:right}.score{font-size:30px;font-weight:900}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 4px;border-bottom:1px solid #ddd;text-align:center}th:first-child,td:first-child{text-align:left}
input,select,textarea{padding:8px;border:1px solid #ccc;border-radius:7px;width:100%;box-sizing:border-box}.row{display:flex;gap:7px;margin:7px 0}.row>*{flex:1}
button.action{background:#101827;color:#fff;border:0;padding:9px 12px;border-radius:8px;font-weight:bold}
button.danger{background:#b91c1c;color:#fff;border:0;padding:9px 12px;border-radius:8px;font-weight:bold}
button.small{padding:6px 12px;border:0;border-radius:7px;font-weight:bold}
.hidden{display:none}.muted{color:#6b7280;font-size:13px}.badge{display:inline-block;padding:4px 7px;border-radius:6px;background:#eef2ff;margin:2px;font-size:12px}
.bracket{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:start}.goalbox{border:1px solid #e5e7eb;border-radius:10px;padding:9px;margin-top:8px}
.goalrow{display:grid;grid-template-columns:1fr 40px 35px 40px;gap:5px;align-items:center;margin:6px 0}
.yearbar{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
@media(max-width:700px){.score{font-size:24px}.team{width:31%}.bracket{grid-template-columns:1fr}.row{flex-wrap:wrap}}
</style>
</head>
<body>
<header><h1>🏆 IT College Football Tournament</h1><div class="sub">Результати турнірів</div><div id="sync" class="sync">Підключення…</div></header>
<nav>
<button class="active" onclick="openTab('live',this)">🔴 LIVE</button>
<button onclick="openTab('table',this)">📊 Таблиця</button>
<button onclick="openTab('matches',this)">📅 Матчі</button>
<button onclick="openTab('playoff',this)">🏆 Плей-оф</button>
<button onclick="openTab('scorers',this)">🥅 Бомбардири</button>
<button onclick="openTab('keepers',this)">🧤 Воротарі</button>
<button onclick="openTab('referees',this)">👨‍⚖️ Судді</button>
<button onclick="openTab('admin',this)">⚙️ Адмін</button>
</nav>
<main>
<section id="yearbar"></section><section id="live"></section><section id="table" class="hidden"></section>
<section id="matches" class="hidden"></section><section id="playoff" class="hidden"></section>
<section id="scorers" class="hidden"></section><section id="keepers" class="hidden"></section>
<section id="referees" class="hidden"></section><section id="admin" class="hidden"></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getDatabase,ref,onValue,set}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

const firebaseConfig={
apiKey:"AIzaSyB2i-s7DtWnLj1izs9RHOjv6lwl3bpzoNo",
authDomain:"it-college-lviv-2026.firebaseapp.com",
databaseURL:"https://it-college-lviv-2026-default-rtdb.firebaseio.com",
projectId:"it-college-lviv-2026",storageBucket:"it-college-lviv-2026.firebasestorage.app",
messagingSenderId:"742260821532",appId:"1:742260821532:web:632463dde333b49cdad9d9"};
const ADMIN_UID="ZBOzMFg4IcMsxbKsk8KV7oixwnF3";
const app=initializeApp(firebaseConfig),db=getDatabase(app),auth=getAuth(app);
const refs={2026:ref(db,"tournament"),2027:ref(db,"tournament2027")};
const defaultTeams=["ІП 12","ІП 21","ІП 22","МТ 11","МТ 12","МТ 21","МТ 22","КІ 11","КІ 12","КІ 13","ТК 12","КН 11","КН 21"];
const refereeInfo=[["Арбітр","Руслан Городняк"],["Асистент арбітра","С. Садовий"],["Асистент арбітра","Л. Галась"],["Четвертий арбітр","В. Литвин"],["Арбітр ВАА","Руслан Городняк Миколайович"]];
let year=localStorage.getItem("it_year")||"2026",data=null,currentUser=null,remoteLoaded=false,teams=[];
const empty=()=>({version:3,teamNames:[...defaultTeams],groups:{A:[],B:[],C:[]},matches:[],players:[],keepers:[],playoff:{},referees:refereeInfo});
const makeMatch=(id,a=1,b=2,time="",group="")=>({id,a,b,time,group,sa:0,sb:0,status:"scheduled",goalsA:[],goalsB:[],keeperA:"",keeperB:""});
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const norm=s=>String(s??"").replace(/[-–—]/g," ").replace(/\s+/g," ").trim().toLowerCase();
const tn=id=>(data.teamNames||teams)[Number(id)-1]||"—";
const isAdmin=()=>!!currentUser&&currentUser.uid===ADMIN_UID;
function sync(t,on=true){const e=document.getElementById("sync");e.textContent=t;e.style.color=on?"#86efac":"#fca5a5"}
function normalizeGoals(a){return Array.isArray(a)?a.map(x=>({playerId:String(x.playerId),goals:Math.max(0,Math.min(15,Number(x.goals)||0))})).filter(x=>x.playerId&&x.goals>0):[]}
function normalize(){
 if(!data||typeof data!=="object")data=empty();
 data.teamNames=Array.isArray(data.teamNames)&&data.teamNames.length?data.teamNames:[...defaultTeams];teams=[...data.teamNames];
 data.groups=data.groups||{A:[],B:[],C:[]};["A","B","C"].forEach(g=>data.groups[g]=Array.isArray(data.groups[g])?data.groups[g].map(Number):[]);
 data.matches=Array.isArray(data.matches)?data.matches:Object.values(data.matches||{});
 data.matches=data.matches.map(m=>({...makeMatch(Number(m.id)||1,Number(m.a)||1,Number(m.b)||2,m.time||"",m.group||""),...m,goalsA:normalizeGoals(m.goalsA),goalsB:normalizeGoals(m.goalsB)}));
 data.players=Array.isArray(data.players)?data.players:[];data.keepers=Array.isArray(data.keepers)?data.keepers:[];data.playoff=data.playoff||{};
}
function openTab(id,b){document.querySelectorAll("main>section:not(#yearbar)").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));if(b)b.classList.add("active");render()}
function groupOf(m){if(["A","B","C"].includes(String(m.group).toUpperCase()))return String(m.group).toUpperCase();for(const[g,ids]of Object.entries(data.groups))if(ids.includes(Number(m.a))&&ids.includes(Number(m.b)))return g;return"—"}
function standings(ids){return ids.map(id=>{let r={id,i:0,w:0,d:0,l:0,gf:0,ga:0,p:0};data.matches.filter(m=>m.status==="finished"&&(Number(m.a)===id||Number(m.b)===id)).forEach(m=>{if(!(ids.includes(Number(m.a))&&ids.includes(Number(m.b))))return;let a=Number(m.a)===id?+m.sa:+m.sb,b=Number(m.a)===id?+m.sb:+m.sa;r.i++;r.gf+=a;r.ga+=b;if(a>b){r.w++;r.p+=3}else if(a===b){r.d++;r.p++}else r.l++});r.gd=r.gf-r.ga;return r}).sort((a,b)=>b.p-a.p||b.gd-a.gd||b.gf-a.gf)}
function table(ids,title){return`<div class="card"><h3>${title}</h3><table><tr><th># Команда</th><th>І</th><th>В</th><th>Н</th><th>П</th><th>ЗМ</th><th>ПМ</th><th>РМ</th><th>О</th></tr>${standings(ids).map((r,i)=>`<tr><td>${i+1}. ${esc(tn(r.id))}</td><td>${r.i}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf}</td><td>${r.ga}</td><td>${r.gd}</td><td><b>${r.p}</b></td></tr>`).join("")}</table></div>`}
function players(id){return data.players.filter(p=>Number(p.teamId)===Number(id))}
function keepers(id){return data.keepers.filter(p=>Number(p.teamId)===Number(id))}
function goalBox(m,side){const id=side==="A"?m.a:m.b,arr=side==="A"?m.goalsA:m.goalsB;return`<div class="goalbox"><b>⚽ Голи ${esc(tn(id))}</b>${players(id).map(p=>{let n=arr.find(x=>String(x.playerId)===String(p.id))?.goals||0;return`<div class="goalrow"><span>${esc(p.name)}</span><button class="small" onclick="goal('${m.id}','${side}','${p.id}',-1)">−</button><b>${n}</b><button class="small" onclick="goal('${m.id}','${side}','${p.id}',1)">+</button></div>`}).join("")||"<p class='muted'>Додай гравців цієї команди в Адмін.</p>"}</div>`}
function keeperBox(m,side){const id=side==="A"?m.a:m.b,val=side==="A"?m.keeperA:m.keeperB;return`<select onchange="editMatch('${m.id}','keeper${side}',this.value)"><option value="">🧤 Воротар ${esc(tn(id))}</option>${keepers(id).map(p=>`<option value="${p.id}" ${String(val)===String(p.id)?"selected":""}>${esc(p.name)}</option>`).join("")}</select>`}
function matchCard(m){return`<div class="card"><b>Матч ${m.id} • ${esc(groupOf(m))}</b><div class="muted">${esc(m.time||"Час не вказано")} • ${m.status==="finished"?"Завершений":m.status==="LIVE"?"LIVE":m.status==="canceled"?"Скасований":"Запланований"}</div><div class="match"><div class="team">${esc(tn(m.a))}</div><div class="score">${+m.sa}:${+m.sb}</div><div class="team right">${esc(tn(m.b))}</div></div></div>`}
function playoffMatch(m){if(!m)return"";return`<div class="card"><h4>${esc(m.name)}</h4>${m.a&&m.b?`<div class="match"><div class="team">${esc(tn(m.a))}</div><div class="score">${+m.sa}:${+m.sb}</div><div class="team right">${esc(tn(m.b))}</div></div><div class="muted">${esc(m.time||"Час не вказано")} • ${m.status}</div>${isAdmin()?`<div class="row"><input placeholder="Час" value="${esc(m.time||"")}" onchange="playEdit('${m.id}','time',this.value)"><input type="number" min="0" value="${+m.sa}" onchange="playEdit('${m.id}','sa',+this.value)"><input type="number" min="0" value="${+m.sb}" onchange="playEdit('${m.id}','sb',+this.value)"><select onchange="playEdit('${m.id}','status',this.value)"><option value="scheduled" ${m.status==="scheduled"?"selected":""}>Запланований</option><option value="LIVE" ${m.status==="LIVE"?"selected":""}>LIVE</option><option value="finished" ${m.status==="finished"?"selected":""}>Завершений</option></select></div>${keeperBox(m,"A")}${keeperBox(m,"B")}${goalBox(m,"A")}${goalBox(m,"B")}`:""}`:"<p class='muted'>Очікується визначення учасників.</p>"}</div>`}
function finishedGroups(){const x=data.matches.filter(m=>["A","B","C"].includes(String(m.group).toUpperCase()));return x.length>0&&x.every(m=>m.status==="finished"||m.status==="canceled")}
function findTeam(n){let i=teams.findIndex(x=>norm(x)===norm(n));return i<0?null:i+1}
function winner(m){return m&&m.status==="finished"&&+m.sa!==+m.sb?(+m.sa>+m.sb?m.a:m.b):null}
function playoff(){
 if(!finishedGroups())return null;let p=data.playoff||{};
 const qf=[
 {id:"qf1",name:"1/4 фіналу 1",a:findTeam("МТ-22"),b:findTeam("ТК-12")},
 {id:"qf2",name:"1/4 фіналу 2",a:findTeam("ІП-21"),b:findTeam("ІП-12")},
 {id:"qf3",name:"1/4 фіналу 3",a:findTeam("МТ-21"),b:findTeam("КІ-11")},
 {id:"qf4",name:"1/4 фіналу 4",a:findTeam("КН-21"),b:findTeam("МТ-11")}
 ].map(x=>({...x,...(p[x.id]||{}),status:p[x.id]?.status||"scheduled"}));
 const sf1={id:"sf1",name:"Півфінал 1",a:winner(qf[0]),b:winner(qf[1]),...(p.sf1||{})};
 const sf2={id:"sf2",name:"Півфінал 2",a:winner(qf[2]),b:winner(qf[3]),...(p.sf2||{})};
 const final={id:"final",name:"ФІНАЛ",a:winner(sf1),b:winner(sf2),...(p.final||{})};
 return{qf,sf1,sf2,final};
}
function render(){
 normalize();
 document.getElementById("yearbar").innerHTML=`<div class="card"><b>Турнір:</b><div class="yearbar"><button class="small ${year==="2026"?"active":""}" onclick="switchYear('2026')">🏆 2026 — архів</button><button class="small ${year==="2027"?"active":""}" onclick="switchYear('2027')">🏆 2027 — новий</button></div></div>`;
 document.getElementById("live").innerHTML=`<div class="card"><h2>🔴 LIVE</h2>${data.matches.filter(m=>m.status==="LIVE").map(matchCard).join("")||"<p class='muted'>Зараз матчів LIVE немає.</p>"}</div>`;
 document.getElementById("table").innerHTML=table(data.groups.A||[],"Група А")+table(data.groups.B||[],"Група Б")+table(data.groups.C||[],"Група С");
 document.getElementById("matches").innerHTML=`<div class="card"><h2>📅 Матчі (${data.matches.length})</h2>${data.matches.map(matchCard).join("")}</div>`;
 let po=playoff();document.getElementById("playoff").innerHTML=po?`<div class="card"><h2>🏆 Плей-оф</h2><p class="muted">Пари чвертьфіналів за заданою схемою.</p></div><div class="bracket"><div><h3>1/4 фіналу</h3>${po.qf.map(playoffMatch).join("")}</div><div><h3>Півфінали</h3>${playoffMatch(po.sf1)}${playoffMatch(po.sf2)}</div><div><h3>Фінал</h3>${playoffMatch(po.final)}</div></div>`:`<div class="card"><h2>🏆 Плей-оф</h2><p class="muted">Плей-оф відкриється після завершення групових матчів.</p></div>`;
 const sm={};data.matches.forEach(m=>[["A",m.a,m.goalsA],["B",m.b,m.goalsB]].forEach(([s,t,a])=>normalizeGoals(a).forEach(g=>{let p=data.players.find(x=>String(x.id)===String(g.playerId));if(!p)return;let k=p.id;if(!sm[k])sm[k]={name:p.name,team:t,g:0};sm[k].g+=g.goals})));
 const arr=Object.values(sm).sort((a,b)=>b.g-a.g);document.getElementById("scorers").innerHTML=`<div class="card"><h2>🥅 Бомбардири</h2>${arr.length?`<table><tr><th>#</th><th>Гравець</th><th>Команда</th><th>Голи</th></tr>${arr.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(tn(x.team))}</td><td><b>${x.g}</b></td></tr>`).join("")}</table>`:"<p class='muted'>Статистика з'явиться після внесення голів.</p>"}</div>`;
 const km={};data.matches.filter(m=>m.status==="finished").forEach(m=>[[m.keeperA,m.a,+m.sb],[m.keeperB,m.b,+m.sa]].forEach(([id,t,c])=>{if(!id)return;let p=data.keepers.find(x=>String(x.id)===String(id));if(!p)return;if(!km[id])km[id]={name:p.name,team:t,i:0,ga:0,cs:0};km[id].i++;km[id].ga+=c;if(c===0)km[id].cs++}));
 const ka=Object.values(km).sort((a,b)=>a.ga-b.ga);document.getElementById("keepers").innerHTML=`<div class="card"><h2>🧤 Воротарі</h2>${ka.length?`<table><tr><th>Воротар</th><th>Команда</th><th>І</th><th>ПМ</th><th>Сухі</th></tr>${ka.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(tn(x.team))}</td><td>${x.i}</td><td>${x.ga}</td><td>${x.cs}</td></tr>`).join("")}</table>`:"<p class='muted'>Статистика з'явиться після внесення воротарів.</p>"}</div>`;
 document.getElementById("referees").innerHTML=`<div class="card"><h2>👨‍⚖️ Судді</h2><table>${refereeInfo.map(x=>`<tr><th>${esc(x[0])}</th><td>${esc(x[1])}</td></tr>`).join("")}</table></div>`;
 renderAdmin();
}
function adminMatch(m){return`<div class="card"><h3>Матч ${m.id}</h3><div class="row"><select onchange="editMatch('${m.id}','a',+this.value)">${teams.map((t,i)=>`<option value="${i+1}" ${+m.a===i+1?"selected":""}>${esc(t)}</option>`).join("")}</select><input type="number" min="0" value="${+m.sa}" onchange="editMatch('${m.id}','sa',+this.value)"><input type="number" min="0" value="${+m.sb}" onchange="editMatch('${m.id}','sb',+this.value)"><select onchange="editMatch('${m.id}','b',+this.value)">${teams.map((t,i)=>`<option value="${i+1}" ${+m.b===i+1?"selected":""}>${esc(t)}</option>`).join("")}</select></div><div class="row"><input value="${esc(m.time||"")}" placeholder="Час" onchange="editMatch('${m.id}','time',this.value)"><select onchange="editMatch('${m.id}','group',this.value)"><option value="">Без групи</option><option value="A" ${m.group==="A"?"selected":""}>Група A</option><option value="B" ${m.group==="B"?"selected":""}>Група B</option><option value="C" ${m.group==="C"?"selected":""}>Група C</option></select><select onchange="editMatch('${m.id}','status',this.value)"><option value="scheduled" ${m.status==="scheduled"?"selected":""}>Запланований</option><option value="LIVE" ${m.status==="LIVE"?"selected":""}>LIVE</option><option value="finished" ${m.status==="finished"?"selected":""}>Завершений</option><option value="canceled" ${m.status==="canceled"?"selected":""}>Скасований</option></select></div>${keeperBox(m,"A")}${keeperBox(m,"B")}${goalBox(m,"A")}${goalBox(m,"B")}${year==="2027"&&m.id>5?`<button class="danger" onclick="deleteMatch('${m.id}')">🗑 Видалити матч</button>`:""}</div>`}
function renderAdmin(){
 const e=document.getElementById("admin");if(!isAdmin()){e.innerHTML=`<div class="card"><h2>⚙️ Адмін</h2><p class="muted">Редагування тільки для адміністратора.</p><div class="row"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Пароль"></div><button class="action" onclick="login()">Увійти</button></div>`;return}
 e.innerHTML=`<div class="card"><h2>⚙️ Адмін — ${year}</h2><button class="action" onclick="logout()">Вийти</button></div>
 <div class="card"><h3>👥 Команди</h3><textarea id="teamsText" rows="7">${esc(teams.join("\n"))}</textarea><button class="action" onclick="saveTeams()">💾 Зберегти</button></div>
 <div class="card"><h3>⚽ Гравці та 🧤 воротарі</h3><div class="row"><select id="pt">${teams.map((t,i)=>`<option value="${i+1}">${esc(t)}</option>`).join("")}</select><input id="pn" placeholder="Прізвище Ім'я"><button class="action" onclick="addPlayer()">➕ Гравець</button></div><div class="row"><select id="kt">${teams.map((t,i)=>`<option value="${i+1}">${esc(t)}</option>`).join("")}</select><input id="kn" placeholder="Прізвище Ім'я"><button class="action" onclick="addKeeper()">➕ Воротар</button></div>${data.players.map(p=>`<span class="badge">${esc(tn(p.teamId))}: ${esc(p.name)}</span>`).join("")}</div>
 <div class="card"><h3>📊 Групи</h3><div class="row"><textarea id="ga" rows="7">${esc((data.groups.A||[]).map(tn).join("\n"))}</textarea><textarea id="gb" rows="7">${esc((data.groups.B||[]).map(tn).join("\n"))}</textarea><textarea id="gc" rows="7">${esc((data.groups.C||[]).map(tn).join("\n"))}</textarea></div><button class="action" onclick="saveGroups()">💾 Зберегти групи</button></div>
 <div class="card"><h3>➕ Матч</h3><p class="muted">${year==="2027"?"5 стартових матчів уже створено.":"Редагуй існуючі матчі 2026."}</p>${year==="2027"?`<button class="action" onclick="addMatch()">➕ Додати матч</button>`:""}</div>${data.matches.map(adminMatch).join("")}`;
}
async function save(){localStorage.setItem("itl_"+year,JSON.stringify(data));if(!remoteLoaded||!isAdmin())return;await set(refs[year],data);sync("● Дані збережено онлайн")}
async function editMatch(id,k,v){if(!isAdmin())return;let m=data.matches.find(x=>String(x.id)===String(id));if(!m)return;m[k]=v;await save();render()}
async function goal(id,side,pid,d){if(!isAdmin())return;let m=data.matches.find(x=>String(x.id)===String(id)),k=side==="A"?"goalsA":"goalsB",a=normalizeGoals(m[k]),x=a.find(g=>String(g.playerId)===String(pid));if(!x){x={playerId:String(pid),goals:0};a.push(x)}x.goals=Math.max(0,Math.min(15,x.goals+d));m[k]=a.filter(g=>g.goals);await save();render()}
async function addMatch(){if(!isAdmin())return;let id=data.matches.length?Math.max(...data.matches.map(m=>+m.id))+1:1;data.matches.push(makeMatch(id));await save();render()}
async function deleteMatch(id){if(!isAdmin()||year!=="2027"||+id<=5)return;if(confirm("Видалити матч?")){data.matches=data.matches.filter(m=>String(m.id)!==String(id));await save();render()}}
async function addPlayer(){if(!isAdmin())return;let n=document.getElementById("pn").value.trim();if(!n)return;data.players.push({id:"p"+Date.now(),teamId:+document.getElementById("pt").value,name:n});await save();render()}
async function addKeeper(){if(!isAdmin())return;let n=document.getElementById("kn").value.trim();if(!n)return;data.keepers.push({id:"k"+Date.now(),teamId:+document.getElementById("kt").value,name:n});await save();render()}
async function saveTeams(){if(!isAdmin())return;let n=document.getElementById("teamsText").value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);let old=[...teams],map=new Map();n.forEach((x,i)=>{let j=old.findIndex(y=>norm(y)===norm(x));if(j>=0)map.set(j+1,i+1)});data.teamNames=n;teams=[...n];data.matches.forEach(m=>{m.a=map.get(+m.a)||m.a;m.b=map.get(+m.b)||m.b});data.groups=Object.fromEntries(Object.entries(data.groups).map(([g,a])=>[g,a.map(x=>map.get(+x)||x).filter(x=>x<=n.length)]));data.players.forEach(p=>p.teamId=map.get(+p.teamId)||p.teamId);data.keepers.forEach(p=>p.teamId=map.get(+p.teamId)||p.teamId);await save();render()}
async function saveGroups(){if(!isAdmin())return;let names=[...teams],find=x=>{let i=names.findIndex(y=>norm(y)===norm(x));if(i<0){names.push(x);i=names.length-1}return i+1},p=id=>document.getElementById(id).value.split(/\n|,/).map(x=>x.trim()).filter(Boolean).map(find);let g={A:p("ga"),B:p("gb"),C:p("gc")};let all=[...g.A,...g.B,...g.C];if(new Set(all).size<all.length){alert("Одна команда не може бути у двох групах.");return}data.teamNames=names;teams=names;data.groups=g;await save();render()}
async function playEdit(id,k,v){if(!isAdmin())return;data.playoff=data.playoff||{};data.playoff[id]=data.playoff[id]||{};data.playoff[id][k]=v;await save();render()}
async function login(){try{let c=await signInWithEmailAndPassword(auth,document.getElementById("email").value,document.getElementById("pass").value);if(c.user.uid!==ADMIN_UID){await signOut(auth);alert("Немає прав адміністратора.")}}catch(e){alert("Помилка входу. Перевір email і пароль.")}}
async function logout(){await signOut(auth)}
async function switchYear(y){year=y;localStorage.setItem("it_year",y);data=null;remoteLoaded=false;render();if(y==="2027"&&!isAdmin()){data=make2027();render();}else onValue(refs[y],s=>{if(s.exists()){data=s.val();normalize()}else{data=year==="2027"?make2027():empty();if(isAdmin())set(refs[y],data)}remoteLoaded=true;sync("● Онлайн синхронізація");render()},{onlyOnce:true})}
function make2027(){let d=empty();d.matches=[makeMatch(1,1,2),makeMatch(2,1,3),makeMatch(3,2,3),makeMatch(4,4,5),makeMatch(5,4,6)];return d}
window.openTab=openTab;window.switchYear=switchYear;window.editMatch=editMatch;window.goal=goal;window.addMatch=addMatch;window.deleteMatch=deleteMatch;window.addPlayer=addPlayer;window.addKeeper=addKeeper;window.saveTeams=saveTeams;window.saveGroups=saveGroups;window.playEdit=playEdit;window.login=login;window.logout=logout;
onAuthStateChanged(auth,u=>{currentUser=u;render()});
onValue(refs[year],s=>{if(s.exists()){data=s.val();normalize()}else{data=year==="2027"?make2027():empty();if(isAdmin())set(refs[year],data)}remoteLoaded=true;sync("● Онлайн синхронізація");render()});
normalize();render();
</script>
